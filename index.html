<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Invoice Generator</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --primary-light: #eff6ff;
      --slate-50: #f8fafc;
      --slate-100: #f1f5f9;
      --slate-200: #e2e8f0;
      --slate-300: #cbd5e1;
      --slate-400: #94a3b8;
      --slate-500: #64748b;
      --slate-600: #475569;
      --slate-700: #334155;
      --slate-800: #1e293b;
      --slate-900: #0f172a;
      --danger: #ef4444;
      --danger-hover: #dc2626;
      --danger-light: #fef2f2;
      --radius: 8px;
      --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
      --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
      --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--slate-100);
      color: var(--slate-800);
      line-height: 1.5;
      padding: 24px 16px;
    }

    .container {
      max-width: 860px;
      margin: 0 auto;
    }

    /* Top Control Bar */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      flex-wrap: wrap;
      gap: 12px;
    }

    .app-title {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--slate-800);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .app-title span {
      background: var(--primary);
      color: white;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .action-group {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      font-size: 0.875rem;
      font-weight: 500;
      padding: 8px 16px;
      border-radius: var(--radius);
      border: 1px solid transparent;
      cursor: pointer;
      transition: all 0.15s ease-in-out;
      outline: none;
    }

    .btn-primary {
      background-color: var(--primary);
      color: #ffffff;
      box-shadow: var(--shadow-sm);
    }

    .btn-primary:hover {
      background-color: var(--primary-hover);
    }

    .btn-outline {
      background-color: #ffffff;
      border-color: var(--slate-300);
      color: var(--slate-700);
    }

    .btn-outline:hover {
      background-color: var(--slate-50);
      border-color: var(--slate-400);
    }

    .btn-danger-outline {
      background-color: #ffffff;
      border-color: #fca5a5;
      color: var(--danger);
    }

    .btn-danger-outline:hover {
      background-color: var(--danger-light);
      border-color: var(--danger);
    }

    .btn-success {
      background-color: #16a34a;
      color: #ffffff;
      box-shadow: var(--shadow-sm);
    }

    .btn-success:hover {
      background-color: #15803d;
    }

    .btn:disabled {
      opacity: 0.65;
      cursor: not-allowed;
    }

    .spin {
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    /* Toast Notification */
    .toast-container {
      position: fixed;
      bottom: 24px;
      right: 24px;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      gap: 8px;
      pointer-events: none;
    }

    .toast-item {
      background-color: var(--slate-900);
      color: #ffffff;
      padding: 12px 18px;
      border-radius: var(--radius);
      box-shadow: var(--shadow-lg);
      font-size: 0.875rem;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 10px;
      pointer-events: auto;
      transition: all 0.25s ease;
      opacity: 0;
      transform: translateY(12px);
    }

    .toast-item.show {
      opacity: 1;
      transform: translateY(0);
    }

    .toast-item.success {
      background-color: #15803d;
    }

    .toast-item.error {
      background-color: #b91c1c;
    }

    .btn-icon-only {
      padding: 6px;
      border-radius: 6px;
    }

    /* Invoice Canvas */
    .invoice-card {
      background-color: #ffffff;
      border-radius: 12px;
      box-shadow: var(--shadow);
      border: 1px solid var(--slate-200);
      padding: 36px;
    }

    /* Header Section */
    .invoice-header {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
      padding-bottom: 28px;
      border-bottom: 2px solid var(--slate-100);
    }

    .form-group {
      margin-bottom: 12px;
    }

    .form-group:last-child {
      margin-bottom: 0;
    }

    label {
      display: block;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--slate-500);
      margin-bottom: 6px;
    }

    .input-field {
      width: 100%;
      padding: 10px 12px;
      font-size: 0.95rem;
      color: var(--slate-900);
      border: 1px solid var(--slate-300);
      border-radius: var(--radius);
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
      background-color: #ffffff;
    }

    .input-field:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
    }

    .business-title-input {
      font-size: 1.35rem;
      font-weight: 700;
      color: var(--slate-900);
    }

    .invoice-meta-side {
      text-align: right;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      justify-content: flex-start;
    }

    .invoice-badge-title {
      font-size: 1.75rem;
      font-weight: 800;
      color: var(--slate-900);
      letter-spacing: 0.05em;
      margin-bottom: 8px;
      line-height: 1;
    }

    .meta-row {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
      margin-bottom: 6px;
      width: 100%;
    }

    .meta-row label {
      margin-bottom: 0;
      white-space: nowrap;
    }

    .meta-row .input-field {
      width: 160px;
      padding: 6px 8px;
      font-size: 0.875rem;
    }

    /* Bill To Section */
    .bill-to-section {
      padding: 24px 0;
      border-bottom: 2px solid var(--slate-100);
    }

    .bill-to-card {
      max-width: 420px;
    }

    /* Add Item Form */
    .add-item-box {
      background-color: var(--slate-50);
      border: 1px solid var(--slate-200);
      border-radius: var(--radius);
      padding: 16px;
      margin: 24px 0 20px;
    }

    .add-item-header {
      font-size: 0.875rem;
      font-weight: 600;
      color: var(--slate-700);
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .add-item-grid {
      display: grid;
      grid-template-columns: 3fr 1fr 1.5fr auto;
      gap: 12px;
      align-items: end;
    }

    /* Table Styles */
    .table-container {
      width: 100%;
      overflow-x: auto;
      margin-bottom: 24px;
    }

    .invoice-table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }

    .invoice-table th {
      background-color: var(--slate-50);
      padding: 12px 14px;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--slate-600);
      border-bottom: 2px solid var(--slate-200);
    }

    .invoice-table td {
      padding: 14px;
      font-size: 0.9rem;
      border-bottom: 1px solid var(--slate-200);
      vertical-align: middle;
    }

    .invoice-table tbody tr:hover {
      background-color: var(--slate-50);
    }

    .col-idx { width: 44px; text-align: center; color: var(--slate-400); font-size: 0.8rem; }
    .col-qty { width: 90px; text-align: center; }
    .col-price { width: 120px; text-align: right; }
    .col-total { width: 130px; text-align: right; font-weight: 600; }
    .col-action { width: 60px; text-align: center; }

    .invoice-table th.col-qty, .invoice-table td.col-qty { text-align: center; }
    .invoice-table th.col-price, .invoice-table td.col-price { text-align: right; }
    .invoice-table th.col-total, .invoice-table td.col-total { text-align: right; }
    .invoice-table th.col-action, .invoice-table td.col-action { text-align: center; }

    .btn-delete {
      background: transparent;
      border: none;
      color: var(--slate-400);
      cursor: pointer;
      padding: 6px;
      border-radius: 4px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s ease;
    }

    .btn-delete:hover {
      color: var(--danger);
      background-color: var(--danger-light);
    }

    .empty-state {
      text-align: center;
      padding: 36px 16px;
      color: var(--slate-400);
      font-size: 0.9rem;
    }

    /* Summary & Totals */
    .invoice-summary {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 24px;
      padding-top: 16px;
      flex-wrap: wrap;
    }

    .notes-container {
      flex: 1;
      min-width: 260px;
    }

    .notes-input {
      width: 100%;
      height: 70px;
      resize: vertical;
      font-family: inherit;
    }

    .totals-box {
      width: 280px;
      margin-left: auto;
    }

    .total-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
      font-size: 0.95rem;
      color: var(--slate-600);
    }

    .total-row.grand-total {
      font-size: 1.25rem;
      font-weight: 800;
      color: var(--slate-900);
      border-top: 2px solid var(--slate-200);
      margin-top: 8px;
      padding-top: 12px;
    }

    .currency-selector-wrap {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.8rem;
      color: var(--slate-500);
      margin-top: 8px;
    }

    .currency-select {
      padding: 4px 6px;
      border-radius: 4px;
      border: 1px solid var(--slate-300);
      font-size: 0.8rem;
      background: white;
    }

    /* Responsive */
    @media (max-width: 680px) {
      body {
        padding: 12px 8px;
      }

      .invoice-card {
        padding: 20px 16px;
      }

      .invoice-header {
        grid-template-columns: 1fr;
        gap: 16px;
      }

      .invoice-meta-side {
        align-items: flex-start;
        text-align: left;
      }

      .meta-row {
        justify-content: flex-start;
      }

      .meta-row .input-field {
        width: 100%;
      }

      .add-item-grid {
        grid-template-columns: 1fr;
      }

      .totals-box {
        width: 100%;
        margin-left: 0;
      }

      .invoice-summary {
        flex-direction: column-reverse;
      }
    }

    /* Print Styles */
    @media print {
      body {
        background-color: #ffffff;
        padding: 0;
        margin: 0;
        color: #000000;
      }

      .container {
        max-width: 100%;
        width: 100%;
      }

      .no-print {
        display: none !important;
      }

      .invoice-card {
        box-shadow: none;
        border: none;
        padding: 0;
        border-radius: 0;
      }

      .input-field {
        border: none !important;
        padding: 0 !important;
        background: transparent !important;
        box-shadow: none !important;
        color: #000000 !important;
      }

      .business-title-input {
        font-size: 1.6rem !important;
        font-weight: 800 !important;
      }

      .invoice-table th {
        background-color: #f8fafc !important;
        color: #000000 !important;
        border-bottom: 2px solid #000000 !important;
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }

      .invoice-table td {
        border-bottom: 1px solid #e2e8f0 !important;
      }

      .total-row.grand-total {
        border-top: 2px solid #000000 !important;
      }

      .notes-input {
        border: none !important;
        padding: 0 !important;
        resize: none !important;
      }

      /* Clean page settings */
      @page {
        margin: 18mm 15mm;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Top Toolbar (Hidden when printing) -->
    <header class="top-bar no-print">
      <div class="app-title">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
          <polyline points="14 2 14 8 20 8"></polyline>
          <line x1="16" y1="13" x2="8" y2="13"></line>
          <line x1="16" y1="17" x2="8" y2="17"></line>
          <polyline points="10 9 9 9 8 9"></polyline>
        </svg>
        Invoice Generator
        <span>Simple</span>
      </div>

      <div class="action-group">
        <button type="button" class="btn btn-outline" id="btnSample" title="Fill sample data">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
            <path d="M12 18v-6"></path>
            <path d="M9 15h6"></path>
          </svg>
          Sample Data
        </button>
        <button type="button" class="btn btn-danger-outline" id="btnClear" title="Clear all fields">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="3 6 5 6 21 6"></polyline>
            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
          </svg>
          Clear
        </button>
        <button type="button" class="btn btn-success" id="btnSave" title="Save invoice to Supabase">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path>
            <polyline points="17 21 17 13 7 13 7 21"></polyline>
            <polyline points="7 3 7 8 15 8"></polyline>
          </svg>
          Save Invoice
        </button>
        <button type="button" class="btn btn-primary" id="btnPrint" title="Print invoice or save as PDF">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="6 9 6 2 18 2 18 9"></polyline>
            <path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path>
            <rect x="6" y="14" width="12" height="8"></rect>
          </svg>
          Print Invoice
        </button>
      </div>
    </header>

    <!-- Main Invoice Document -->
    <main class="invoice-card" id="invoice">
      <!-- Header: Business Info & Invoice Metadata -->
      <section class="invoice-header">
        <div>
          <div class="form-group">
            <label for="businessName">From (My Shop Name)</label>
            <input 
              type="text" 
              id="businessName" 
              class="input-field business-title-input" 
              placeholder="e.g. Apex Electronics & Goods"
              value="Apex Corner Store"
            />
          </div>
          <div class="form-group">
            <label for="businessContact">Contact / Address (Optional)</label>
            <input 
              type="text" 
              id="businessContact" 
              class="input-field" 
              placeholder="123 Market St, city@example.com, +1 555-0199"
              value="123 Market St • contact@apexstore.com"
            />
          </div>
        </div>

        <div class="invoice-meta-side">
          <div class="invoice-badge-title">INVOICE</div>
          <div class="meta-row">
            <label for="invoiceNumber">Invoice #</label>
            <input type="text" id="invoiceNumber" class="input-field" value="INV-00101" />
          </div>
          <div class="meta-row">
            <label for="invoiceDate">Date</label>
            <input type="date" id="invoiceDate" class="input-field" />
          </div>
        </div>
      </section>

      <!-- Customer Section -->
      <section class="bill-to-section">
        <div class="bill-to-card">
          <div class="form-group">
            <label for="customerName">Bill To (Customer Name)</label>
            <input 
              type="text" 
              id="customerName" 
              class="input-field" 
              placeholder="e.g. Jane Doe"
              value="Jane Doe"
            />
          </div>
          <div class="form-group">
            <label for="customerContact">Customer Contact / Address (Optional)</label>
            <input 
              type="text" 
              id="customerContact" 
              class="input-field" 
              placeholder="jane@example.com • 456 Broadway Ave"
              value="jane.doe@example.com • 456 Broadway Ave"
            />
          </div>
        </div>
      </section>

      <!-- Add Item Form (Hidden when printing) -->
      <section class="add-item-box no-print">
        <div class="add-item-header">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="12" y1="8" x2="12" y2="16"></line>
            <line x1="8" y1="12" x2="16" y2="12"></line>
          </svg>
          Add New Item
        </div>
        <form id="addItemForm" class="add-item-grid" onsubmit="event.preventDefault(); handleAddItem();">
          <div class="form-group">
            <label for="itemName">Item Name / Description</label>
            <input 
              type="text" 
              id="itemName" 
              class="input-field" 
              placeholder="e.g. Wireless Mouse" 
              required
              autocomplete="off"
            />
          </div>
          <div class="form-group">
            <label for="itemQty">Quantity</label>
            <input 
              type="number" 
              id="itemQty" 
              class="input-field" 
              min="1" 
              step="1" 
              value="1" 
              required
            />
          </div>
          <div class="form-group">
            <label for="itemPrice">Unit Price</label>
            <input 
              type="number" 
              id="itemPrice" 
              class="input-field" 
              min="0" 
              step="0.01" 
              placeholder="0.00" 
              required
            />
          </div>
          <div>
            <button type="submit" class="btn btn-primary" id="btnAddItem" style="height: 42px; width: 100%;">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="12" y1="5" x2="12" y2="19"></line>
                <line x1="5" y1="12" x2="19" y2="12"></line>
              </svg>
              Add Item
            </button>
          </div>
        </form>
      </section>

      <!-- Items Table -->
      <section class="table-container">
        <table class="invoice-table" id="itemsTable">
          <thead>
            <tr>
              <th class="col-idx">#</th>
              <th>Item Description</th>
              <th class="col-qty">Qty</th>
              <th class="col-price">Unit Price</th>
              <th class="col-total">Total</th>
              <th class="col-action no-print">Action</th>
            </tr>
          </thead>
          <tbody id="itemsBody">
            <!-- Dynamic item rows will be injected here -->
          </tbody>
        </table>
        <div id="emptyState" class="empty-state" style="display: none;">
          No items added yet. Fill in the form above and click "Add Item".
        </div>
      </section>

      <!-- Invoice Summary / Totals -->
      <section class="invoice-summary">
        <div class="notes-container">
          <label for="invoiceNotes">Notes / Terms</label>
          <textarea 
            id="invoiceNotes" 
            class="input-field notes-input" 
            placeholder="e.g. Thank you for your business! Payment due within 15 days."
          >Thank you for your business!</textarea>
          
          <div class="currency-selector-wrap no-print">
            <label for="currencySelect" style="margin-bottom: 0;">Currency:</label>
            <select id="currencySelect" class="currency-select" onchange="handleCurrencyChange()">
              <option value="$">USD ($)</option>
              <option value="€">EUR (€)</option>
              <option value="£">GBP (£)</option>
              <option value="Rs." selected>PKR (Pakistani Rupee - Rs.)</option>
              <option value="₹">INR (₹)</option>
              <option value="C$">CAD (C$)</option>
              <option value="A$">AUD (A$)</option>
              <option value="¥">JPY / CNY (¥)</option>
            </select>
          </div>
        </div>

        <div class="totals-box">
          <div class="total-row">
            <span>Subtotal:</span>
            <span id="subtotalDisplay">Rs. 0.00</span>
          </div>
          <div class="total-row grand-total">
            <span>Total Due:</span>
            <span id="totalDisplay">Rs. 0.00</span>
          </div>
        </div>
      </section>
    </main>
  </div>

  <script>
    // Supabase Configuration
    const SUPABASE_URL = "https://agvxfzzamyehxmjhaojl.supabase.co";
    const SUPABASE_KEY = "sb_publishable_PHVDoWE2XFFr78fxvb_-cA_4GxjAxX9";
    let supabaseClient = null;

    try {
      if (window.supabase) {
        supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
      }
    } catch (err) {
      console.warn("Supabase initialization error:", err);
    }

    // App State
    let items = [
      { id: 1, name: "Wireless Mechanical Keyboard", qty: 1, price: 89.99 },
      { id: 2, name: "Ergonomic Desk Pad", qty: 2, price: 19.50 },
      { id: 3, name: "USB-C Multiport Hub", qty: 1, price: 45.00 }
    ];

    let currentCurrency = "Rs.";

    // Set today's date on load
    function initDate() {
      const today = new Date().toISOString().split("T")[0];
      const dateInput = document.getElementById("invoiceDate");
      if (!dateInput.value) {
        dateInput.value = today;
      }
    }

    // Format money helper
    function formatCurrency(amount) {
      const formatted = Number(amount).toLocaleString(undefined, {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
      });
      const space = (currentCurrency.length > 1 && !currentCurrency.endsWith(" ")) ? " " : "";
      return currentCurrency + space + formatted;
    }

    // Render items table & recalculate total
    function renderTable() {
      const tbody = document.getElementById("itemsBody");
      const emptyState = document.getElementById("emptyState");
      const subtotalDisplay = document.getElementById("subtotalDisplay");
      const totalDisplay = document.getElementById("totalDisplay");

      tbody.innerHTML = "";

      if (items.length === 0) {
        emptyState.style.display = "block";
      } else {
        emptyState.style.display = "none";
      }

      let grandTotal = 0;

      items.forEach((item, index) => {
        const lineTotal = item.qty * item.price;
        grandTotal += lineTotal;

        const row = document.createElement("tr");
        row.innerHTML = `
          <td class="col-idx">${index + 1}</td>
          <td><strong>${escapeHtml(item.name)}</strong></td>
          <td class="col-qty">${item.qty}</td>
          <td class="col-price">${formatCurrency(item.price)}</td>
          <td class="col-total">${formatCurrency(lineTotal)}</td>
          <td class="col-action no-print">
            <button 
              type="button" 
              class="btn-delete" 
              title="Delete item" 
              onclick="deleteItem(${item.id})"
              aria-label="Delete ${escapeHtml(item.name)}"
            >
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="3 6 5 6 21 6"></polyline>
                <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                <line x1="10" y1="11" x2="10" y2="17"></line>
                <line x1="14" y1="11" x2="14" y2="17"></line>
              </svg>
            </button>
          </td>
        `;
        tbody.appendChild(row);
      });

      // Update total displays
      subtotalDisplay.textContent = formatCurrency(grandTotal);
      totalDisplay.textContent = formatCurrency(grandTotal);
    }

    // Add Item Handler
    function handleAddItem() {
      const nameInput = document.getElementById("itemName");
      const qtyInput = document.getElementById("itemQty");
      const priceInput = document.getElementById("itemPrice");

      const name = nameInput.value.trim();
      const qty = parseInt(qtyInput.value, 10);
      const price = parseFloat(priceInput.value);

      if (!name) {
        alert("Please enter an item name.");
        nameInput.focus();
        return;
      }

      if (isNaN(qty) || qty <= 0) {
        alert("Please enter a valid quantity greater than 0.");
        qtyInput.focus();
        return;
      }

      if (isNaN(price) || price < 0) {
        alert("Please enter a valid price (0 or higher).");
        priceInput.focus();
        return;
      }

      const newItem = {
        id: Date.now(),
        name: name,
        qty: qty,
        price: price
      };

      items.push(newItem);
      renderTable();

      // Reset item inputs
      nameInput.value = "";
      qtyInput.value = "1";
      priceInput.value = "";
      nameInput.focus();
    }

    // Delete Item Handler
    function deleteItem(id) {
      items = items.filter(item => item.id !== id);
      renderTable();
    }

    // Handle Currency Selector
    function handleCurrencyChange() {
      const select = document.getElementById("currencySelect");
      currentCurrency = select.value;
      renderTable();
    }

    // Reset / Clear Form
    function clearInvoice() {
      if (confirm("Are you sure you want to clear this invoice?")) {
        document.getElementById("businessName").value = "";
        document.getElementById("businessContact").value = "";
        document.getElementById("customerName").value = "";
        document.getElementById("customerContact").value = "";
        document.getElementById("invoiceNumber").value = "INV-00101";
        document.getElementById("invoiceNotes").value = "";
        items = [];
        renderTable();
      }
    }

    // Populate Sample Data
    function loadSampleData() {
      document.getElementById("businessName").value = "Apex Corner Store";
      document.getElementById("businessContact").value = "123 Market St • contact@apexstore.com";
      document.getElementById("customerName").value = "Jane Doe";
      document.getElementById("customerContact").value = "jane.doe@example.com • 456 Broadway Ave";
      document.getElementById("invoiceNumber").value = "INV-00101";
      document.getElementById("invoiceNotes").value = "Thank you for your business! Payment due within 15 days.";
      
      items = [
        { id: 1, name: "Wireless Mechanical Keyboard", qty: 1, price: 89.99 },
        { id: 2, name: "Ergonomic Desk Pad", qty: 2, price: 19.50 },
        { id: 3, name: "USB-C Multiport Hub", qty: 1, price: 45.00 }
      ];
      renderTable();
    }

    // Toast notification helper
    function showToast(message, type = "info") {
      const container = document.getElementById("toastContainer");
      if (!container) return;
      const toast = document.createElement("div");
      toast.className = `toast-item ${type}`;
      toast.textContent = message;
      container.appendChild(toast);

      requestAnimationFrame(() => {
        toast.classList.add("show");
      });

      setTimeout(() => {
        toast.classList.remove("show");
        setTimeout(() => toast.remove(), 250);
      }, 3500);
    }

    // Save invoice to Supabase 'invoices' table
    async function saveInvoiceToSupabase(silent = false) {
      const businessName = document.getElementById("businessName").value.trim();
      const customerName = document.getElementById("customerName").value.trim();

      if (!businessName) {
        if (!silent) {
          showToast("Please enter a Business Name before saving.", "error");
          document.getElementById("businessName").focus();
        }
        return false;
      }

      if (!customerName) {
        if (!silent) {
          showToast("Please enter a Customer Name before saving.", "error");
          document.getElementById("customerName").focus();
        }
        return false;
      }

      const grandTotal = items.reduce((sum, item) => sum + (item.qty * item.price), 0);
      const saveBtn = document.getElementById("btnSave");
      const originalHtml = saveBtn ? saveBtn.innerHTML : "";

      if (saveBtn) {
        saveBtn.disabled = true;
        saveBtn.innerHTML = `
          <svg class="spin" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10" stroke-opacity="0.25"></circle>
            <path d="M12 2a10 10 0 0 1 10 10" stroke-linecap="round"></path>
          </svg>
          Saving...
        `;
      }

      const payload = {
        business_name: businessName,
        customer_name: customerName,
        total: parseFloat(grandTotal.toFixed(2))
      };

      try {
        let inserted = null;

        if (window.supabase && supabaseClient) {
          const { data, error } = await supabaseClient
            .from("invoices")
            .insert([payload])
            .select();
          if (error) throw error;
          inserted = data;
        } else {
          // Direct PostgREST fallback
          const response = await fetch(`${SUPABASE_URL}/rest/v1/invoices`, {
            method: "POST",
            headers: {
              "apikey": SUPABASE_KEY,
              "Authorization": `Bearer ${SUPABASE_KEY}`,
              "Content-Type": "application/json",
              "Prefer": "return=representation"
            },
            body: JSON.stringify(payload)
          });
          if (!response.ok) {
            const errData = await response.json();
            throw new Error(errData.message || "Failed to save invoice.");
          }
          inserted = await response.json();
        }

        const idText = inserted && inserted[0] && inserted[0].id ? ` (ID: #${inserted[0].id})` : "";
        showToast(`✓ Invoice saved to Supabase!${idText}`, "success");
        return true;
      } catch (err) {
        console.error("Supabase save error:", err);
        showToast(`Error saving to Supabase: ${err.message || err}`, "error");
        return false;
      } finally {
        if (saveBtn) {
          saveBtn.disabled = false;
          saveBtn.innerHTML = originalHtml;
        }
      }
    }

    // Safe HTML helper
    function escapeHtml(text) {
      const div = document.createElement("div");
      div.textContent = text;
      return div.innerHTML;
    }

    // Event Listeners
    document.addEventListener("DOMContentLoaded", () => {
      initDate();
      renderTable();

      document.getElementById("btnSave").addEventListener("click", () => {
        saveInvoiceToSupabase(false);
      });

      document.getElementById("btnPrint").addEventListener("click", () => {
        saveInvoiceToSupabase(true);
        window.print();
      });

      document.getElementById("btnClear").addEventListener("click", clearInvoice);
      document.getElementById("btnSample").addEventListener("click", loadSampleData);
    });
  </script>

  <!-- Toast Notification Container -->
  <div id="toastContainer" class="toast-container no-print"></div>
</body>
</html>
